<style>
/* =========================================================
   THOMSON CLINIC — shared shell (header, nav, search, footer)
   (Homepage-only sections such as hero network, brand rail,
   care/india/specialization blocks were removed: this page never used them.)
========================================================= */
:root{
--black:#171719;--white:#fff;--paper:#f5f5f7;--paper2:#fafafa;
--text:#1d1d1f;--muted:#6e6e73;--muted2:#86868b;--line:#e5e5e7;
--blue:#0071e3;--blue-dark:#0066cc;--blue-soft:#eaf4ff;--green:#34c759;
--max:1180px;--radius:26px;--radius-lg:34px;
--shadow:0 25px 70px rgba(0,0,0,.09);
--ec-accent:var(--blue);--ec-surface:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif;color:var(--text);background:white;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit}
.container{width:min(calc(100% - 48px),var(--max));margin:auto}

/* LOGO */
.thomson-logo{display:flex;align-items:center;gap:10px}
.logo-symbol{width:38px;height:38px;border-radius:10px;object-fit:contain;background:transparent;flex-shrink:0}
.logo-text{display:flex;flex-direction:column;line-height:1.05}
.logo-main{font-size:16px;font-weight:700;letter-spacing:-.045em}
.logo-sub{margin-top:4px;color:#77777c;font-size:6.5px;font-weight:600;letter-spacing:.055em;text-transform:uppercase}

/* HEADER */
.header{position:fixed;top:0;left:0;right:0;height:68px;z-index:1000;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid rgba(0,0,0,.055)}
.header-inner{height:100%;display:flex;align-items:center;justify-content:space-between}
.nav{display:flex;align-items:center;gap:clamp(14px,1.8vw,24px)}
.nav a{font-size:11px;color:#444446;transition:.2s ease}
.nav a:hover{color:#000}
.nav-dropdown{position:relative}
.nav-submenu{display:none;position:absolute;top:100%;left:-12px;min-width:170px;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 12px 28px rgba(0,0,0,.12)}
.nav-dropdown:hover .nav-submenu,.nav-dropdown:focus-within .nav-submenu{display:flex;flex-direction:column;gap:4px}
.nav-submenu a{display:block;padding:8px 10px;white-space:nowrap}
.nav .join-team-trigger,.nav .community-clinic-trigger{padding:0;border:0;background:transparent;color:#444446;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap;transition:color .2s ease}
.nav .join-team-trigger:hover,.nav .community-clinic-trigger:hover{color:#000}
.nav-cta{padding:9px 16px;border-radius:999px;background:var(--blue);color:white!important;font-weight:600}
.mobile-menu{display:none;background:none;border:0;font-size:22px}

/* HEADER SEARCH */
.doctor-search{position:relative;flex:0 1 300px;min-width:190px;margin:0 22px}
.doctor-search-form{position:relative}
.doctor-search-icon{position:absolute;top:50%;left:13px;width:16px;height:16px;color:#77777c;transform:translateY(-50%);pointer-events:none}
.doctor-search-input{width:100%;height:38px;padding:0 38px;border:1px solid #e3e5e8;border-radius:999px;outline:none;background:rgba(248,249,250,.92);color:var(--text);font:500 12px/1 Inter,-apple-system,BlinkMacSystemFont,sans-serif;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
.doctor-search-input::placeholder{color:#858990}
.doctor-search-input:focus{border-color:#92bdf0;background:#fff;box-shadow:0 0 0 3px rgba(0,113,227,.11)}
.doctor-search-clear{position:absolute;top:50%;right:7px;display:none;width:26px;height:26px;align-items:center;justify-content:center;border:0;border-radius:50%;background:transparent;color:#71757b;font-size:18px;line-height:1;transform:translateY(-50%);cursor:pointer}
.doctor-search.has-query .doctor-search-clear{display:flex}
.doctor-search-results{position:absolute;top:calc(100% + 9px);left:0;z-index:1100;width:min(420px,calc(100vw - 30px));max-height:40vh;overflow:auto;overscroll-behavior:contain;padding:7px;border:1px solid rgba(22,32,44,.09);border-radius:16px;background:rgba(255,255,255,.98);box-shadow:0 18px 48px rgba(20,32,46,.18);backdrop-filter:blur(18px)}
.doctor-search-results[hidden]{display:none}
.doctor-search-result{display:block;padding:9px 10px;border-radius:11px;color:var(--text);transition:background .15s ease}
.doctor-search-result:hover,.doctor-search-result:focus-visible{outline:none;background:#f0f6fd}
.doctor-search-result:focus-visible{box-shadow:inset 0 0 0 2px rgba(0,113,227,.5)}
.doctor-search-result-name{display:block;overflow:hidden;color:#20242a;font-size:12px;font-weight:700;line-height:1.3;text-overflow:ellipsis;white-space:nowrap}
.doctor-search-result-specialty{display:block;margin-top:2px;overflow:hidden;color:#49535d;font-size:10.5px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}
.doctor-search-empty{padding:13px 10px 15px;color:#6e747c;font-size:12px;line-height:1.5}

/* FOOTER */
.footer{padding:65px 0 30px;background:var(--paper);border-top:1px solid var(--line)}
.footer-grid{display:grid;grid-template-columns:1.6fr .7fr .7fr .8fr;gap:50px}
.footer-description{max-width:350px;margin-top:15px;color:var(--muted);font-size:10px;line-height:1.7}
.footer-heading{margin-bottom:15px;font-size:10px;font-weight:600}
.footer-links{display:grid;gap:9px}
.footer-links a{color:var(--muted);font-size:10px}
.footer-links a:hover{color:var(--black)}
.footer-bottom{margin-top:55px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:#99999e;font-size:9px}

/* SHARED RESPONSIVE (header / nav / footer) */
@media(max-width:1050px){
  .header{height:auto;min-height:112px}
  .header-inner{height:auto;min-height:112px;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;padding:7px 0 9px}
  .doctor-search{order:3;flex:0 0 100%;min-width:0;margin:0}
  .doctor-search-input{height:36px}
  .doctor-search-results{width:100%}
  .nav{display:none;position:fixed;top:112px;left:0;right:0;padding:25px;background:rgba(255,255,255,.98);flex-direction:column;align-items:flex-start;gap:20px;border-bottom:1px solid var(--line)}
  .nav.open{display:flex}
  .nav a{font-size:15px}
  .nav-dropdown{width:100%}
  .nav-submenu{display:flex;position:static;flex-direction:column;gap:8px;min-width:0;padding:8px 0 0 14px;border:0;background:transparent;box-shadow:none}
  .nav-submenu a{padding:0}
  .nav .join-team-trigger,.nav .community-clinic-trigger{font-size:15px}
  .mobile-menu{display:block}
  .ec-main{padding-top:112px}
}
@media(max-width:650px){
  .container{width:calc(100% - 30px)}
  .footer-grid{grid-template-columns:1fr;gap:32px}
  .footer-bottom{flex-direction:column;align-items:flex-start;gap:8px}
}
</style>

<style>
/* Community eClinic layer */
body{padding-top:0}
.ec-main{padding-top:68px;background:var(--paper);min-height:60vh}
.ec-container{width:min(1180px,calc(100% - 40px));margin:0 auto}
.ec-hero{padding:64px 0 38px;background:linear-gradient(135deg,#fafafa 0%,#edf4fb 100%)}
.ec-kicker{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.ec-hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:40px;align-items:center}
.ec-hero-grid.no-image{grid-template-columns:1fr}
.ec-title{font-size:clamp(38px,5.4vw,68px);line-height:1.02;letter-spacing:-.065em;margin:13px 0 18px;max-width:800px}
.ec-subtitle{color:var(--muted);font-size:16px;line-height:1.75;max-width:680px}
.ec-parent{font-size:12px;color:var(--muted);margin-bottom:10px}
.ec-hero-image{width:100%;height:300px;object-fit:cover;border-radius:28px;background:#e8edf3;box-shadow:var(--shadow)}
.ec-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}
.ec-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:12px 18px;font-weight:650;font-size:13px;cursor:pointer;transition:transform .2s,background .2s}
.ec-btn:hover{transform:translateY(-1px)}
.ec-btn-primary{background:var(--blue);color:white}
.ec-btn-dark{background:#171719;color:white}
.ec-btn-soft{background:white;border-color:var(--line);color:var(--text)}
.ec-section{padding:42px 0}
.ec-section-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:20px}
.ec-section-head h2{font-size:clamp(24px,3vw,34px);letter-spacing:-.045em;line-height:1.1}
.ec-section-head p{margin-top:7px;color:var(--muted);font-size:13px;max-width:650px}
.ec-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ec-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.ec-card{min-width:0;padding:22px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.88);box-shadow:0 8px 28px rgba(0,0,0,.035)}
.ec-card h3{font-size:17px;letter-spacing:-.025em;margin:0 0 7px}
.ec-card p{font-size:13px;line-height:1.65;color:var(--muted);overflow-wrap:anywhere}
.ec-card-image{width:100%;height:140px;object-fit:cover;border-radius:14px;margin-bottom:14px;background:#e9edf3}
.ec-actions-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ec-person{display:grid;grid-template-columns:76px minmax(0,1fr);gap:15px;align-items:start}
.ec-avatar{width:76px;height:82px;border-radius:16px;object-fit:cover;background:#e9edf3}
.ec-meta{font-size:12px;color:var(--muted);margin-top:5px}
.ec-empty{padding:20px;border:1px dashed #c9cdd2;border-radius:16px;color:var(--muted);font-size:13px}
.ec-hours{display:grid;gap:8px;margin-top:12px}
.ec-alert{border:1px solid #f0d4a7;background:#fff8e9;border-radius:18px;padding:20px}
.ec-alert h3{font-size:16px;margin-bottom:6px}
.ec-alert p{font-size:13px;color:#6d5b3f;line-height:1.7}
.ec-modal{position:fixed;inset:0;z-index:2000;background:rgba(15,20,28,.48);display:none;align-items:center;justify-content:center;padding:18px}
.ec-modal.open{display:flex}
.ec-dialog{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.24)}
.ec-dialog-head{display:flex;justify-content:space-between;align-items:start;gap:15px;margin-bottom:20px}
.ec-dialog h2{font-size:25px;letter-spacing:-.04em}
.ec-close{border:0;background:#f1f1f3;border-radius:50%;width:36px;height:36px;font-size:21px;cursor:pointer}
.ec-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.ec-field{display:grid;gap:6px;min-width:0}
.ec-field.full{grid-column:1/-1}
.ec-field label{font-size:12px;font-weight:650}
.ec-field input,.ec-field select,.ec-field textarea{width:100%;min-width:0;border:1px solid #d9dce0;border-radius:12px;padding:12px;background:#fff;color:var(--text);font-size:14px;font-family:inherit}
.ec-field textarea{resize:vertical;min-height:80px}
.ec-note{font-size:11px;line-height:1.6;color:var(--muted);margin-top:13px}
.ec-status{font-size:12px;margin-top:10px;color:#b42318}
.ec-floating{position:fixed;right:20px;bottom:20px;z-index:900;box-shadow:0 8px 24px rgba(0,0,0,.18)}
[hidden]{display:none!important}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(0,113,227,.35);outline-offset:3px}

/* Tabs and provider directory */
.ec-tabs{display:flex;gap:7px;overflow-x:auto;padding:5px;margin:0 0 22px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.78);scrollbar-width:thin}
.ec-tab{flex:0 0 auto;border:0;border-radius:12px;padding:11px 15px;background:transparent;color:var(--muted);font-size:12px;font-weight:650;cursor:pointer;white-space:nowrap}
.ec-tab.active{background:#171719;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.ec-tab-panel{padding:4px 0 10px}
.ec-panel-intro{margin:0 0 20px}
.ec-panel-intro h3,.ec-subheading h3{font-size:22px;letter-spacing:-.04em}
.ec-panel-intro p,.ec-subheading p{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.6;max-width:650px}
.ec-subheading{margin:28px 0 15px}
.ec-provider-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:20px;border:1px solid var(--line);border-radius:20px;background:#fff;margin-bottom:14px}
.ec-provider-filters select{width:100%;border:1px solid #d9dce0;border-radius:12px;padding:13px;background:#fff;color:var(--text);font-size:14px}
.ec-provider-detail{min-height:140px}
.ec-provider-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:17px}
.ec-provider-fact{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fafafa;min-width:0}
.ec-provider-label,.ec-provider-value{display:block;overflow-wrap:anywhere}
.ec-provider-label{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ec-provider-value{font-size:13px;margin-top:4px}
.ec-community-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.85fr);gap:22px;align-items:start}
.ec-community-copy{padding:18px 0}
.ec-community-copy h3{font-size:clamp(26px,3.3vw,38px);letter-spacing:-.05em;line-height:1.1;margin:10px 0}
.ec-community-copy p,.ec-community-copy li{color:var(--muted);font-size:13px;line-height:1.75}
.ec-community-copy ul{padding-left:20px;margin:13px 0}
.ec-community-form{display:grid;gap:14px}
.ec-community-form .ec-btn{width:100%}
.ec-step{width:34px;height:34px;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:800;margin-bottom:15px}
.ec-faq-list{background:#fff;border:1px solid var(--line);border-radius:20px;padding:0 22px}
.ec-faq{border-bottom:1px solid var(--line);padding:16px 0}
.ec-faq:last-child{border-bottom:0}
.ec-faq summary{font-size:14px;font-weight:650;cursor:pointer;list-style-position:inside}
.ec-faq p{padding:10px 0 0 20px;color:var(--muted);font-size:13px;line-height:1.7}
.ec-sample-note{margin-top:10px;padding:9px 11px;border-radius:10px;background:#fff7e6;color:#795600;font-size:11px;line-height:1.5}
#specialist-services{scroll-margin-top:100px}
#professionals,#faq{scroll-margin-top:100px}

@media(max-width:850px){.ec-hero-grid{grid-template-columns:1fr}.ec-hero-image{height:240px}.ec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ec-hero{padding:42px 0 30px}}
@media(max-width:700px){.ec-community-layout{grid-template-columns:1fr}.ec-provider-filters{grid-template-columns:1fr}.ec-provider-facts{grid-template-columns:1fr}.ec-tabs{margin-left:-2px;margin-right:-2px}.ec-tab{padding:10px 12px}}
@media(max-width:560px){.ec-container{width:calc(100% - 28px)}.ec-grid,.ec-grid.two{grid-template-columns:1fr}.ec-hero-image{height:200px}.ec-section{padding:30px 0}.ec-card{padding:18px}.ec-section-head{display:block}.ec-form-grid{grid-template-columns:1fr}.ec-field.full{grid-column:auto}.ec-floating{right:12px;bottom:12px}.ec-title{font-size:40px}.ec-actions .ec-btn{flex:1 1 auto}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

</head>

<!-- ======================= HEADER (filled from config) ======================= -->
<header class="header">
<div class="container header-inner">

  <a href="#top" class="thomson-logo" id="headerLogo" aria-label="Thomson Clinic">
    <img class="logo-symbol" id="headerLogoImg" src="assets/thomson-clinic-logo-header.png" alt="Thomson Clinic logo">
    <span class="logo-text"><span class="logo-main" id="headerLogoMain">Thomson Clinic</span><span class="logo-sub" id="headerLogoSub">Mental Health &amp; Neuroscience e-Clinic</span></span>
  </a>

  <div class="doctor-search" id="doctorSearch">
    <form class="doctor-search-form" role="search" onsubmit="return false">
      <svg class="doctor-search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"></circle><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>

  </div>

  <nav class="nav" id="nav"></nav>

</div>
</header>

      <div class="ec-provider-filters">
        <div class="ec-field"><label for="providerCategory">Service category</label><select id="providerCategory"><option value="">Select a category</option></select></div>
        <div class="ec-field"><label for="providerChoice">Provider / service</label><select id="providerChoice" disabled><option value="">Select a category first</option></select></div>
      </div>
      <div class="ec-provider-detail ec-card" id="providerDetail" aria-live="polite"></div>
      <p class="ec-note" id="providersNote"></p>
    </section>

    <!-- Tab 2: WhatsApp community -->
    <section class="ec-tab-panel" id="communityPanel" role="tabpanel" aria-labelledby="communityTab" hidden>
      <div class="ec-community-layout">
        <div class="ec-community-copy">
          <div class="ec-kicker" id="communityKicker"></div>
          <h3 id="communityHeading"></h3>
          <p id="communityText"></p>
          <ul id="communityBullets"></ul>
          <p class="ec-note" id="communityNote"></p>
          <div class="ec-actions" id="communityInviteWrap" hidden></div>
        </div>
        <form id="communityForm" class="ec-card ec-community-form" novalidate>
          <div class="ec-field"><label for="communityName">Your name *</label><input id="communityName" name="name" autocomplete="name" maxlength="100" required></div>
          <div class="ec-field"><label for="communityPhone">WhatsApp mobile number *</label><input id="communityPhone" name="phone" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="10-digit mobile number" required></div>
          <div class="ec-field" id="communityAreaField"><label for="communityArea">Village / town (optional)</label><input id="communityArea" name="area" maxlength="120" placeholder="Your village or town"></div>
          <div class="ec-field" id="communityInterestField"><label for="communityInterest">What updates are you interested in? (optional)</label><select id="communityInterest" name="interest"></select></div>
          <p class="ec-status" id="communityStatus" role="alert" aria-live="polite"></p>
          <button class="ec-btn ec-btn-primary" type="submit">Continue to WhatsApp</button>

    <!-- Tab 3: how it works -->

        <div class="ec-field"><label for="patientPhone">Mobile number *</label><input id="patientPhone" name="patientPhone" inputmode="tel" autocomplete="tel" required maxlength="20" placeholder="10-digit mobile number"></div>
        <div class="ec-field full"><label for="doctorChoice">Specialist service / doctor *</label><select id="doctorChoice" name="doctorChoice" required></select></div>

<!-- =====================================================================
     RENDER ENGINE — you normally never need to edit this.
     It reads window.ECLINIC_CONFIG (defined in the last <script> below).
===================================================================== -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  const C = window.ECLINIC_CONFIG || {};
  const $ = id => document.getElementById(id);
  const show = key => (C.show || {})[key] !== false;           // section switch: default = visible
  const live = arr => (arr || []).filter(x => x && x.enabled !== false);  // drop items with enabled:false
  const T = C.text || {};
  const clinic = C.clinic || {};

  /* ---------- helpers ---------- */
  function make(tag, cls, text){ const n=document.createElement(tag); if(cls)n.className=cls; if(text!==undefined&&text!==null)n.textContent=String(text); return n; }
  function safeUrl(v){ try{ const u=new URL(v,location.href); return ['https:','http:','tel:','mailto:'].includes(u.protocol)?u.href:''; }catch{ return ''; } }
  function action(label,url,cls='ec-btn ec-btn-soft'){ const href=safeUrl(url); if(!href)return null; const a=make('a',cls,label); a.href=href; if(/^https?:/.test(href)&&new URL(href).origin!==location.origin){a.target='_blank';a.rel='noopener noreferrer';} return a; }
  function waUrl(num,msg){ const d=String(num||'').replace(/\D/g,''); if(d.length<10||d.length>15)return ''; return 'https://wa.me/'+d+'?text='+encodeURIComponent(msg); }
  function openWhatsApp(num,msg,statusEl){ const u=waUrl(num,msg); if(!u){ if(statusEl)statusEl.textContent='WhatsApp contact has not been configured. Please contact the page administrator.'; return false;} window.open(u,'_blank','noopener,noreferrer'); return true; }
  function setText(id,val){ const el=$(id); if(el) el.textContent = val||''; }
  function hideIf(id,cond){ const el=$(id); if(el) el.hidden = !!cond; }
  const factList = v => Array.isArray(v) ? v.join(', ') : v;

  /* ---------- brand / document title ---------- */
  const brand = C.brand || {};
  document.title = (clinic.name || 'Community Superspeciality eClinic') + ' | ' + (brand.name || 'Thomson Clinic');
  [['headerLogoImg','footerLogoImg']].flat().forEach(id=>{ if(brand.logo)$(id).src=brand.logo; });
  setText('headerLogoMain',brand.name||'Thomson Clinic'); setText('footerLogoMain',brand.name||'Thomson Clinic');
  setText('headerLogoSub',brand.tagline||''); setText('footerLogoSub',brand.tagline||'');
  hideIf('headerLogoSub',!brand.tagline); hideIf('footerLogoSub',!brand.tagline);

  /* ---------- hero ---------- */
  const hero = C.hero || {};
  hideIf('heroSection',!show('hero'));
  setText('heroParent',hero.parentLine||''); hideIf('heroParent',!hero.parentLine);
  setText('clinicKicker',clinic.label||''); setText('clinicName',clinic.name||'');
  setText('clinicDescription',clinic.description||''); setText('clinicTagline',clinic.tagline||'');
  hideIf('clinicTagline',!clinic.tagline);
  setText('heroNote',hero.note||''); hideIf('heroNote',!hero.note);
  if(hero.image && safeUrl(hero.image)){ const im=$('heroImage'); im.src=safeUrl(hero.image); im.alt=hero.imageAlt||''; im.hidden=false; $('heroGrid').classList.remove('no-image'); }

  /* ---------- booking choices (specialties + doctors) ---------- */
  const choices=$('doctorChoice'); choices.replaceChildren(); choices.append(new Option('Select a service or doctor',''));
  const bookingNumbers={};   // label -> whatsapp number (per-item override, else clinic default)
  const specialties = show('specialties') ? live(C.specialties).filter(x=>x.name) : [];
  const doctors     = show('doctors')     ? live(C.doctors).filter(x=>x.name)     : [];
  const specLabel = s => s.name;
  const docLabel  = d => d.name + (d.specialty ? ' — ' + d.specialty : '');
  specialties.forEach(s=>{ if(s.bookable!==false){ choices.append(new Option(specLabel(s),specLabel(s))); bookingNumbers[specLabel(s)]=s.bookingWhatsApp||clinic.bookingWhatsApp; } });
  doctors.forEach(d=>{ if(d.bookable!==false){ choices.append(new Option(docLabel(d),docLabel(d))); bookingNumbers[docLabel(d)]=d.bookingWhatsApp||clinic.bookingWhatsApp; } });
  const hasBookables = choices.options.length>1;

  /* ---------- services & doctors ---------- */
  const sv = C.sections || {};
  setText('servicesTitle',(sv.services||{}).title||'Superspeciality services');
  setText('servicesIntro',(sv.services||{}).intro||'');
  setText('doctorsTitle',(sv.doctors||{}).title||'Specialists');
  setText('doctorsIntro',(sv.doctors||{}).intro||'');

  const serviceCards=$('specialtyCards'), doctorCards=$('doctorCards');
  function bookButton(label,value,cls){ const b=make('button',cls||'ec-btn ec-btn-primary',label); b.type='button'; b.addEventListener('click',()=>{ choices.value=value; openBooking(); }); return b; }

  specialties.forEach(s=>{
    const c=make('article','ec-card');
    if(s.image && safeUrl(s.image)){ const im=make('img','ec-card-image'); im.src=safeUrl(s.image); im.alt=s.name; im.loading='lazy'; c.append(im); }
    c.append(make('h3','',s.name));
    const meta=[s.fee,s.mode].filter(Boolean).join(' · '); if(meta)c.append(make('div','ec-meta',meta));
    c.append(make('p','',s.description||'Contact us to request details about this service.'));
    const row=make('div','ec-actions-row');
    if(hasBookables && show('booking') && s.bookable!==false) row.append(bookButton(s.buttonLabel||'Book appointment',specLabel(s)));
    if(s.link) row.append(action(s.linkLabel||'Learn more',s.link));
    row.childElementCount && c.append(row);
    serviceCards.append(c);
  });
  if(!specialties.length && show('specialties')) serviceCards.append(make('div','ec-empty','No specialist services have been configured yet.'));
  hideIf('specialtyCards',!specialties.length && !show('specialties'));

  doctors.forEach(d=>{
    const c=make('article','ec-card'); const wrap=make('div',d.photo?'ec-person':''); const body=make('div');
    if(d.photo && safeUrl(d.photo)){ const im=make('img','ec-avatar'); im.src=safeUrl(d.photo); im.alt=d.name; im.loading='lazy'; wrap.append(im); }
    body.append(make('h3','',d.name));
    if(d.sample) body.append(make('p','ec-sample-note','DEMO PROFILE — replace with a verified clinician before publishing.'));
    if(d.specialty) body.append(make('p','',d.specialty));
    const fee = d.fee!==undefined&&d.fee!=='' ? (/^\d+$/.test(String(d.fee)) ? 'Consultation fee: ₹'+d.fee : d.fee) : '';
    const meta=[d.qualification,d.experience,fee,d.languages?'Languages: '+factList(d.languages):'',d.availability?'Availability: '+d.availability:''].filter(Boolean).join(' · ');
    if(meta) body.append(make('div','ec-meta',meta));
    if(d.description) body.append(make('p','',d.description));
    const row=make('div','ec-actions-row');
    if(hasBookables && show('booking') && d.bookable!==false) row.append(bookButton(d.buttonLabel||'Request appointment',docLabel(d)));
    if(d.profileUrl) row.append(action('View profile',d.profileUrl));
    if(row.childElementCount) body.append(row);
    wrap.append(body); c.append(wrap); doctorCards.append(c);
  });
  hideIf('doctorHeading',!doctors.length); hideIf('doctorCards',!doctors.length);
  hideIf('specialist-services',!show('specialties') && !show('doctors'));

  /* ---------- emergency notice ---------- */
  const em=C.emergency||{};
  if(show('emergency') && em.text){ setText('emergencyTitle',em.title||'In an emergency'); setText('emergencyText',em.text); $('emergencySection').hidden=false; }

  /* ---------- tabs ---------- */
  const tabDefs=[
    {id:'providersTab',panel:'providersPanel',key:'providersTab',label:T.providersTab||'Local providers'},
    {id:'communityTab',panel:'communityPanel',key:'communityTab',label:T.communityTab||'Join WhatsApp group'},
    {id:'howTab',panel:'howPanel',key:'howTab',label:T.howTab||'How it works'}
  ].filter(t=>show(t.key));
  const tabBar=$('tabBar');
  tabDefs.forEach(t=>{ const b=make('button','ec-tab',t.label); b.type='button'; b.id=t.id; b.setAttribute('role','tab'); b.setAttribute('aria-controls',t.panel); b.dataset.tab=t.panel; tabBar.append(b); });
  document.querySelectorAll('.ec-tab-panel').forEach(p=>{ if(!tabDefs.some(t=>t.panel===p.id)) p.remove(); });

  function showTab(panelId,scroll=true){
    const target=$(panelId); if(!target)return;
    document.querySelectorAll('.ec-tab-panel').forEach(p=>p.hidden=p.id!==panelId);
    document.querySelectorAll('.ec-tab').forEach(t=>{ const a=t.dataset.tab===panelId; t.classList.toggle('active',a); t.setAttribute('aria-selected',String(a)); t.tabIndex=a?0:-1; });
    if(scroll) target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
  }
  document.querySelectorAll('.ec-tab').forEach((t,i,arr)=>{
    t.addEventListener('click',()=>showTab(t.dataset.tab));
    t.addEventListener('keydown',e=>{ if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return; e.preventDefault(); let n=i; if(e.key==='ArrowRight')n=(i+1)%arr.length; if(e.key==='ArrowLeft')n=(i-1+arr.length)%arr.length; if(e.key==='Home')n=0; if(e.key==='End')n=arr.length-1; arr[n].focus(); showTab(arr[n].dataset.tab); });
  });
  setText('supportTitle',(sv.support||{}).title||'Community support');
  setText('supportIntro',(sv.support||{}).intro||'');
  hideIf('professionals',!tabDefs.length);
  if(tabDefs.length) showTab(tabDefs[0].panel,false);

  /* ---------- local providers ---------- */
  const pv=C.providersSection||{};
  setText('providersHeading',pv.title||'Local service providers'); setText('providersIntro',pv.intro||'Select a category, then a provider.');
  setText('providersNote',pv.note||''); hideIf('providersNote',!pv.note);
  const providerGroups=C.providers||{};
  const catSelect=$('providerCategory'), provSelect=$('providerChoice'), detail=$('providerDetail');
  const categories=live(C.providerCategories).filter(c=>live(providerGroups[c.key]).some(p=>p.name));
  categories.forEach(c=>catSelect.append(new Option(c.label,c.key)));
  const listFor = key => live(providerGroups[key]).filter(p=>p.name);

  function showProvider(p){
    detail.replaceChildren();
    if(!p){ detail.append(make('p','ec-empty','Select a provider to view their details.')); return; }
    const catLabel=(C.providerCategories||[]).find(c=>c.key===catSelect.value)?.label;
    detail.append(make('div','ec-kicker',p.role||catLabel||'Community provider'));
    detail.append(make('h3','',p.name));
    if(p.sample) detail.append(make('p','ec-sample-note','SAMPLE PROFILE — replace with verified provider details before publishing.'));
    if(p.qualification) detail.append(make('p','',p.qualification));
    if(p.description) detail.append(make('p','',p.description));
    const facts=make('div','ec-provider-facts');
    [['Contact',p.phone],['Location / area',p.location],['Address',p.address],['Service hours',p.hours],['Services offered',factList(p.services)],['Fees / charges',p.fees],['Languages',factList(p.languages)]]
      .filter(x=>x[1]).forEach(([l,v])=>{ const box=make('div','ec-provider-fact'); box.append(make('span','ec-provider-label',l),make('span','ec-provider-value',v)); facts.append(box); });
    if(facts.childElementCount) detail.append(facts);
    const acts=[];
    if(p.phone) acts.push(action('Call provider','tel:'+String(p.phone).replace(/[^+\d]/g,'')));
    if(p.whatsapp) acts.push(action('WhatsApp provider','https://wa.me/'+String(p.whatsapp).replace(/\D/g,'')));
    if(p.mapUrl) acts.push(action('Open directions',p.mapUrl));
    if(p.website) acts.push(action('Website',p.website));
    const ok=acts.filter(Boolean); if(ok.length){ const row=make('div','ec-actions-row'); ok.forEach(a=>row.append(a)); detail.append(row); }
  }
  catSelect.addEventListener('change',()=>{
    provSelect.replaceChildren(); const list=listFor(catSelect.value);
    provSelect.disabled=!list.length;
    provSelect.append(new Option(list.length?'Select a provider':'No providers configured',''));
    list.forEach((p,i)=>provSelect.append(new Option(p.name,String(i))));
    if(list.length===1){ provSelect.value='0'; showProvider(list[0]); }
    else if(!list.length) detail.replaceChildren(make('p','ec-empty','No providers have been configured in this category yet.'));
    else showProvider(null);
  });
  provSelect.addEventListener('change',()=>{ showProvider(provSelect.value!==''?listFor(catSelect.value)[Number(provSelect.value)]:null); });
  if(!categories.length){ catSelect.disabled=true; detail.replaceChildren(make('p','ec-empty','Local service provider details will appear here once configured.')); }
  else detail.replaceChildren(make('p','ec-empty','Select a category to view configured providers.'));

  /* ---------- WhatsApp community ---------- */
  const cm=C.community||{};
  setText('communityKicker',cm.kicker||'Community updates');
  setText('communityHeading',cm.title||'Join the community WhatsApp group');
  setText('communityText',cm.text||'');
  const bl=$('communityBullets'); (cm.bullets||[]).filter(Boolean).forEach(b=>bl.append(make('li','',b))); hideIf('communityBullets',!bl.childElementCount);
  setText('communityNote',cm.note||''); hideIf('communityNote',!cm.note);
  hideIf('communityAreaField',cm.askArea===false); hideIf('communityInterestField',cm.askInterest===false);
  (cm.interests&&cm.interests.length?cm.interests:['General community updates']).forEach(i=>$('communityInterest').append(new Option(i,i)));
  if(clinic.communityGroupInviteUrl){ const a=action(cm.inviteLabel||'Open group invitation',clinic.communityGroupInviteUrl,'ec-btn ec-btn-dark'); if(a){ $('communityInviteWrap').append(a); $('communityInviteWrap').hidden=false; } }
  $('communityForm').addEventListener('submit',e=>{
    e.preventDefault(); const status=$('communityStatus'); status.textContent='';
    const name=$('communityName').value.trim(), phone=$('communityPhone').value.trim(), digits=phone.replace(/\D/g,'');
    if(name.length<2){status.textContent='Please enter your name.';return;}
    if(digits.length<10||digits.length>15){status.textContent='Please enter a valid WhatsApp mobile number.';return;}
    if(!clinic.communityWhatsApp){status.textContent='The community coordinator WhatsApp number has not been configured.';return;}
    const lines=['Request to join the '+(clinic.name||'Thomson Clinic')+' WhatsApp community','Name: '+name,'WhatsApp mobile: '+phone];
    if(cm.askArea!==false) lines.push('Village / town: '+($('communityArea').value.trim()||'Not specified'));
    if(cm.askInterest!==false) lines.push('Interested in: '+$('communityInterest').value);
    lines.push('Please share the group invitation and any joining guidelines.');
    openWhatsApp(clinic.communityWhatsApp,lines.join('\n'),status);
  });

  /* ---------- how it works ---------- */
  live(C.howItWorks).forEach((s,i)=>{ const c=make('article','ec-card'); c.append(make('div','ec-step',String(i+1).padStart(2,'0')),make('h3','',s.title),make('p','',s.text)); $('howSteps').append(c); });

  /* ---------- FAQ ---------- */
  const faqs=live(C.faqs).filter(f=>f.question&&f.answer);
  setText('faqTitle',(sv.faq||{}).title||'Frequently asked questions'); setText('faqIntro',(sv.faq||{}).intro||'');
  faqs.forEach(f=>{ const d=make('details','ec-faq'); d.append(make('summary','',f.question),make('p','',f.answer)); $('faqList').append(d); });
  hideIf('faq',!show('faq')||!faqs.length);

  /* ---------- booking modal ---------- */
  const bookingModal=$('bookingModal'); const bk=C.booking||{}; let lastFocus=null;
  setText('bookingKicker',bk.kicker||'Thomson Clinic eClinic'); setText('bookingTitle',bk.title||'Request an online consultation');
  setText('bookingNote',bk.note||'This page does not store your details. WhatsApp will open with your request; review it and press Send. Your appointment is not confirmed until the provider responds.');
  $('reason').placeholder=bk.reasonPlaceholder||'Avoid sharing highly sensitive medical details here.';
  hideIf('dateField',bk.askDate===false); hideIf('timeField',bk.askTime===false); hideIf('reasonField',bk.askReason===false);
  function openBooking(){ lastFocus=document.activeElement; bookingModal.classList.add('open'); bookingModal.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; setTimeout(()=>$('patientName').focus(),20); }
  function closeBooking(){ bookingModal.classList.remove('open'); bookingModal.setAttribute('aria-hidden','true'); document.body.style.overflow=''; if(lastFocus&&lastFocus.focus)lastFocus.focus(); }
  $('closeBooking').addEventListener('click',closeBooking); $('cancelBooking').addEventListener('click',closeBooking);
  bookingModal.addEventListener('click',e=>{ if(e.target===bookingModal)closeBooking(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&bookingModal.classList.contains('open'))closeBooking(); });
  $('bookingForm').addEventListener('submit',e=>{
    e.preventDefault(); const status=$('formStatus'); status.textContent='';
    const name=$('patientName').value.trim(), phone=$('patientPhone').value.trim(), choice=choices.value, digits=phone.replace(/\D/g,'');
    if(name.length<2){status.textContent='Please enter the patient name.';return;}
    if(digits.length<10||digits.length>15){status.textContent='Please enter a valid mobile number.';return;}
    if(!choice){status.textContent='Please select a service or doctor.';return;}
    const number=bookingNumbers[choice]||clinic.bookingWhatsApp;
    if(!number){status.textContent='The appointment WhatsApp number has not been configured.';return;}
    const lines=['Online appointment request — '+(clinic.name||'Thomson Clinic eClinic'),'Patient: '+name,'Mobile: '+phone,'Service / doctor: '+choice];
    if(bk.askDate!==false) lines.push('Preferred date: '+($('preferredDate').value||'Not specified'));
    if(bk.askTime!==false) lines.push('Preferred time: '+($('preferredTime').value||'Not specified'));
    if(bk.askReason!==false) lines.push('Brief reason: '+($('reason').value.trim()||'Not provided'));
    lines.push('Please confirm availability, fees and next steps. This is a request, not a confirmed appointment.');
    if(openWhatsApp(number,lines.join('\n'),status)) closeBooking();
  });

  /* ---------- navigation (header) ---------- */
  const nav=$('nav');
  function sectionAvailable(href){ if(!href||href.length<2||href[0]!=='#')return true; const t=document.querySelector(href); return !!t&&!t.hidden; }
  function navLink(it){
    if(it.type==='join'||it.type==='community'){ const b=make('button',it.type==='join'?'join-team-trigger':'community-clinic-trigger',it.label); b.type='button'; return b; }
    const a=make('a',it.type==='book'?'nav-cta book-trigger':'',it.label); a.href=it.href||'#'; if(it.type==='book')a.setAttribute('data-book',''); return a;
  }
  live(C.nav).forEach(it=>{
    if(it.type==='book' && !(hasBookables&&show('booking'))) return;
    if(it.type==='dropdown'){ const w=make('div','nav-dropdown'); const a=make('a','',it.label); a.href=it.href||'#'; const sub=make('div','nav-submenu'); live(it.children).forEach(ch=>sub.append(navLink(ch))); w.append(a,sub); nav.append(w); return; }
    if(!sectionAvailable(it.href)) return;
    nav.append(navLink(it));
  });
  const menu=$('mobileMenu');
  menu.addEventListener('click',()=>{ const open=nav.classList.toggle('open'); menu.setAttribute('aria-expanded',String(open)); menu.setAttribute('aria-label',open?'Close navigation':'Open navigation'); menu.textContent=open?'×':'☰'; });
  nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{ nav.classList.remove('open'); menu.setAttribute('aria-expanded','false'); menu.textContent='☰'; }));

  /* ---------- hero buttons ---------- */
  live(hero.buttons).forEach(b=>{
    const cls='ec-btn ec-btn-'+(b.style||'soft');
    if(b.type==='book'){ if(!(hasBookables&&show('booking')))return; const x=make('button',cls,b.label); x.type='button'; x.setAttribute('data-book',''); $('heroButtons').append(x); }
    else if(b.type==='tab'){ const t=tabDefs.find(t=>t.panel===b.target||t.id===b.target); if(!t)return; const x=make('button',cls,b.label); x.type='button'; x.addEventListener('click',()=>{ showTab(t.panel); $('professionals').scrollIntoView({behavior:'smooth',block:'start'}); }); $('heroButtons').append(x); }
    else { const a=action(b.label,b.href,cls); if(a)$('heroButtons').append(a); }
  });
  hideIf('heroButtons',!$('heroButtons').childElementCount);

  /* ---------- floating button + all [data-book] ---------- */
  const floatLabel=(C.booking||{}).floatingLabel; if(floatLabel)$('floatingBook').textContent=floatLabel;
  document.querySelectorAll('[data-book]').forEach(b=>{
    if(!(hasBookables&&show('booking'))||(b.id==='floatingBook'&&!show('floatingBook'))){ b.hidden=true; return; }
    b.addEventListener('click',e=>{ e.preventDefault(); openBooking(); });
  });

  /* ---------- footer ---------- */
  const ft=C.footer||{};
  hideIf('footerEl',!show('footer'));
  setText('footerDescription',ft.description||'');
  live(ft.columns).forEach(col=>{
    const links=live(col.links); if(!links.length)return;
    const wrap=make('div'); wrap.append(make('div','footer-heading',col.heading)); const list=make('div','footer-links');
    links.forEach(l=>{
      const a=make('a',l.type==='community'?'community-clinic-trigger':l.type==='book'?'book-trigger':'',l.label); a.href=l.href||'#';
      if(l.type==='book'){ if(!(hasBookables&&show('booking')))return; a.setAttribute('data-book',''); a.addEventListener('click',e=>{e.preventDefault();openBooking();}); }
      list.append(a);
    });
    wrap.append(list); $('footerGrid').append(wrap);
  });
  $('footerGrid').style.gridTemplateColumns = window.innerWidth>650 ? '1.6fr '+'.8fr '.repeat(Math.max(1,$('footerGrid').children.length-1)) : '';
  const left=$('footerLeft'); left.append('© '+new Date().getFullYear()+' '+(ft.copyright||'Thomson Clinic'));
  if(ft.poweredBy&&ft.poweredBy.label){ left.append(' powered by '); const a=action(ft.poweredBy.label,ft.poweredBy.url,''); if(a)left.append(a); else left.append(ft.poweredBy.label); }
  setText('footerRight',ft.tagline||'');
});
</script>
