<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Doctor Login | Thomson Clinic</title>

  <link
    rel="stylesheet"
    href="assets/css/main.css"
  >

  <style>

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f5f7;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: #ffffff;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    .login-brand {
      font-size: 28px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 8px;
    }

    .login-title {
      font-size: 22px;
      margin: 0 0 8px;
      color: #1d1d1f;
    }

    .login-description {
      color: #6e6e73;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    #google-signin {
      display: flex;
      justify-content: center;
      min-height: 44px;
    }

    .login-status {
      margin-top: 20px;
      color: #6e6e73;
      font-size: 14px;
      line-height: 1.5;
    }

    .login-status.error {
      color: #c62828;
    }

    .login-status.success {
      color: #16803c;
    }

  </style>

  <!-- Google Identity Services -->
  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
  ></script>

</head>


<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-brand">
        Thomson Clinic
      </div>

      <h1 class="login-title">
        Doctor Portal
      </h1>

      <p class="login-description">
        Sign in with your authorized Google account
        to access your appointment inbox.
      </p>

      <div id="google-signin"></div>

      <div
        id="login-status"
        class="login-status"
        aria-live="polite"
      ></div>

    </section>

  </main>


  <script>

    // ========================================
    // THOMSON CLINIC API
    // ========================================

    const API_URL =
      'https://script.google.com/macros/s/AKfycbwBlm1hceeXi7SWCu457cbauUsv5qx0tkdDB5mP_XO7GtloDiFg7fnuIW6VhylOacvvXg/exec';


    // ========================================
    // GOOGLE OAUTH CLIENT ID
    // ========================================

    const GOOGLE_CLIENT_ID =
      '531332755116-5lqbn38ja7dqvr9f41bep5hrerf85hne.apps.googleusercontent.com';


    // ========================================
    // SESSION STORAGE KEYS
    // ========================================

    const TOKEN_KEY =
      'thomson_google_token';

    const DOCTOR_KEY =
      'thomson_doctor';


    // ========================================
    // HANDLE GOOGLE LOGIN
    // ========================================

    function handleGoogleCredential(response) {

      const status =
        document.getElementById('login-status');


      status.className =
        'login-status';

      status.textContent =
        'Signing you in...';


      // --------------------------------------
      // Make sure Google returned a credential
      // --------------------------------------

      if (
        !response ||
        !response.credential
      ) {

        status.className =
          'login-status error';

        status.textContent =
          'Google authentication did not return a credential.';

        return;
      }


      // --------------------------------------
      // Send Google ID token to Apps Script
      // --------------------------------------

      fetch(API_URL, {

        method: 'POST',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body: JSON.stringify({

          action:
            'googleLogin',

          credential:
            response.credential

        })

      })


      // --------------------------------------
      // Parse API response
      // --------------------------------------

      .then(function(response) {

        if (!response.ok) {

          throw new Error(
            'Unable to connect to Thomson Clinic server.'
          );
        }

        return response.json();

      })


      // --------------------------------------
      // Process authentication response
      // --------------------------------------

      .then(function(result) {

        if (!result.success) {

          throw new Error(
            result.message ||
            'Authentication failed.'
          );
        }


        // ------------------------------------
        // Store Google ID token
        //
        // IMPORTANT:
        // Dashboard uses the same key.
        // ------------------------------------

        sessionStorage.setItem(
          TOKEN_KEY,
          response.credential
        );


        // ------------------------------------
        // Store authenticated doctor data
        // ------------------------------------

        sessionStorage.setItem(
          DOCTOR_KEY,
          JSON.stringify(result.data)
        );


        // ------------------------------------
        // Show success
        // ------------------------------------

        status.className =
          'login-status success';

        status.textContent =
          'Authentication successful. Opening your dashboard...';


        // ------------------------------------
        // Redirect to doctor dashboard
        // ------------------------------------

        setTimeout(function() {

          window.location.href =
            'doctor-dashboard.html';

        }, 300);

      })


      // --------------------------------------
      // Handle errors
      // --------------------------------------

      .catch(function(error) {

        console.error(
          'Thomson Clinic login error:',
          error
        );


        status.className =
          'login-status error';

        status.textContent =
          error.message ||
          'Unable to sign in. Please try again.';

      });

    }


    // ========================================
    // INITIALIZE GOOGLE SIGN-IN
    // ========================================

    function initializeGoogleSignIn() {

      if (
        !window.google ||
        !google.accounts ||
        !google.accounts.id
      ) {

        document.getElementById(
          'login-status'
        ).textContent =
          'Google Sign-In is still loading. Please wait...';

        setTimeout(
          initializeGoogleSignIn,
          500
        );

        return;
      }


      // --------------------------------------
      // Initialize Google Identity Services
      // --------------------------------------

      google.accounts.id.initialize({

        client_id:
          GOOGLE_CLIENT_ID,

        callback:
          handleGoogleCredential

      });


      // --------------------------------------
      // Render Google Sign-In button
      // --------------------------------------

      google.accounts.id.renderButton(

        document.getElementById(
          'google-signin'
        ),

        {

          theme:
            'outline',

          size:
            'large',

          text:
            'signin_with',

          shape:
            'rectangular',

          width:
            300

        }

      );

    }


    // ========================================
    // PAGE LOAD
    // ========================================

    window.addEventListener(
      'load',
      initializeGoogleSignIn
    );

  </script>

</body>

</html>
